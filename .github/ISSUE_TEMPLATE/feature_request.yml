name: 功能请求
description: 提议一个新功能或改进
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前请先看两点：
        1. 本项目只是 Dufs 的 `--assets` 换皮前端，**Dufs 没有的能力（配额、多条目服务端打包、分享链接与过期时间、逐目录权限等）不在这里实现**。这类需求请提到 [sigoden/dufs](https://github.com/sigoden/dufs)。
        2. 已经明确否决过的方向不再重复讨论：把扩展 API 默认开在鉴权之外、匿名可访问门禁区、前端自行推断登录态。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先描述场景和痛点，再谈方案（只有方案的话很难判断值不值得做）
      placeholder: 我在手机上管理网盘，长文件名被截断后看不到全名。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你期望的行为
      description: 界面应该变成什么样，交互怎么走
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他做法（可选）
      description: 你想到过的其他做法，以及为什么没选它们
  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      description: 这个改动大概会落在哪里
      options:
        - 前端界面 / 交互
        - 扩展 API（scripts/lume-info-api.sh）
        - Docker 编排与配置
        - 文档
        - 不确定
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我搜过已有 issue（含已关闭的），没有重复
          required: true
        - label: 我愿意在需要时补充复现材料或帮忙验证
          required: false
