version: 2

updates:
  # 前端依赖（React / Vite / Tailwind / i18next / fflate / lucide-react）
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      time: "04:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      # 同一批小版本/补丁合成一个 PR，避免每周刷一串单包 PR
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # 工作流自身用到的 Action
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      time: "04:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3

  # docker/ 里的基础镜像：只有 compose.yaml 里的字面量（`caddy:2-alpine`）会被自动提；
  # 取自 ARG 默认值的（Dockerfile.ui 的 sigoden/dufs、Dockerfile.api 的 ARG BASE）dependabot 看不见 ⇒ 必须手动升，见 docs/ai-development-notes.md 3C
  - package-ecosystem: docker
    directories:
      - "/docker"
    schedule:
      interval: weekly
      time: "04:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
